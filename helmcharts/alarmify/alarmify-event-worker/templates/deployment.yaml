apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alarmify-event-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: alarmify
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: alarmify-event-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alarmify-event-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
      containers:
        - name: worker
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: alarmify-event-worker-vars
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: DEBUG
              value: {{ .Values.debug | quote }}
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: NATS_STREAM
              value: {{ .Values.nats.stream | quote }}
            - name: NATS_CONSUMER
              value: {{ .Values.nats.consumer | quote }}
            - name: NATS_USER
              value: {{ .Values.nats.user | quote }}
            - name: NATS_MODE
              value: {{ .Values.nats.mode | quote }}
            - name: NATS_SUBJECT
              value: {{ .Values.nats.subject | quote }}
            {{- if .Values.externalSecrets.dbHostOverride }}
            - name: DB_HOST
              value: {{ .Values.externalSecrets.dbHostOverride | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
