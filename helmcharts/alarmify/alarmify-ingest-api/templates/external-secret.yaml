apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alarmify-ingest-api-vars
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alarmify-ingest-api
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: alarmify
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: alarmify-ingest-api-vars
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: {{ if .Values.externalSecrets.dbHostOverride }}Merge{{ else }}Replace{{ end }}
      metadata:
        labels:
          app.kubernetes.io/name: alarmify-ingest-api
          app.kubernetes.io/component: credentials
          app.kubernetes.io/part-of: alarmify
          app.kubernetes.io/managed-by: Helm
        annotations:
          external-secrets.io/managed-by: external-secrets
      {{- if .Values.externalSecrets.dbHostOverride }}
      data:
        DB_HOST: {{ .Values.externalSecrets.dbHostOverride | quote }}
      {{- end }}
  dataFrom:
    {{- range .Values.externalSecrets.appVarsKeys }}
    - extract:
        key: {{ . }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
  {{- if .Values.externalSecrets.secretKeyRefs }}
  data:
    {{- range .Values.externalSecrets.secretKeyRefs }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        property: {{ .remoteRef.property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
  {{- end }}
