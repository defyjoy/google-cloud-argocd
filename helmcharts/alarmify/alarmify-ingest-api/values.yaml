image:
  repository: harbor.workquark.org/alarmify/alarmify-ingest-api
  tag: v0.0.14
  pullPolicy: IfNotPresent

replicas: 1

containerPort: 8086
servicePort: 80

debug: "true"

nats:
  subject: "alarmify.events.raw"
  mode: "jetstream"

imagePullSecrets:
  - name: alarmify-ingest-api-registry

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

externalSecrets:
  secretStore: vault-secretstore
  registryCredentialKey: alarmify/dev/harbor
  appVarsKeys:
    - alarmify/dev/alarmify-ingest-api
    - alarmify/dev/postgres/credentials
  dbHostOverride: ""
  secretKeyRefs:
    - secretKey: ZITADEL_ISSUER
      remoteRef:
        key: alarmify/management/zitadel
        property: ZITADEL_ISSUER
    - secretKey: ZITADEL_AUDIENCE
      remoteRef:
        key: alarmify/management/zitadel
        property: ZITADEL_AUDIENCE

httproute:
  path: /
  gatewayName: gateway
  gatewayNamespace: gateway-system
  gatewayListener: http
