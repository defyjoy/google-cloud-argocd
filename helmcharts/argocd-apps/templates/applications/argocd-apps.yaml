---
# ArgoCD Apps Application (App-of-Apps Pattern)
# This Application manages all ApplicationSets that define other applications
#
# This enables the App-of-Apps pattern where:
# 1. ArgoCD manages itself (argocd.yaml)
# 2. ArgoCD Apps manages all ApplicationSets (this file)
# 3. ApplicationSets manage individual applications

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-apps
  namespace: argocd
  # Finalizer ensures proper cleanup
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: argocd-apps
    app.kubernetes.io/component: bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-29"  # Second: after ArgoCD self-management (-30), before every ApplicationSet
spec:
  # Project to which this application belongs
  project: default
  
  # Source repository configuration
  source:
    # Git repository URL (update this to your fork/repo)
    repoURL: git@github.com:defyjoy/argocd-google-cloud.git
    
    # Branch/tag/commit to sync
    targetRevision: HEAD
    
    # Path to ArgoCD Apps helm chart
    path: helmcharts/argocd-apps
    
    # Helm configuration
    helm:
      # Use the values.yaml from the chart
      valueFiles:
        - values.yaml
  
  # Destination cluster and namespace
  destination:
    # Local cluster (self)
    server: https://kubernetes.default.svc
    
    # Target namespace (ApplicationSets live in argocd namespace)
    namespace: argocd
  
  # Sync policy configuration
  syncPolicy:
    # Automated sync configuration
    automated:
      # Prune resources that are no longer in Git
      prune: true
      
      # Self-heal: sync when cluster state deviates from Git
      selfHeal: true
      
      # Don't allow empty commits to delete everything
      allowEmpty: false
    
    # Sync options
    syncOptions:
      # Create namespace if it doesn't exist
      - CreateNamespace=true
      
      # Use server-side apply
      - ServerSideApply=true
      
      # Respect ignore differences
      - RespectIgnoreDifferences=true
    
    # Retry configuration for failed syncs
    retry:
      # Number of retry attempts
      limit: 5
      
      # Backoff strategy
      backoff:
        # Initial retry delay
        duration: 5s
        
        # Backoff factor
        factor: 2
        
        # Maximum retry delay
        maxDuration: 3m
  
  # Revision history limit
  revisionHistoryLimit: 10

