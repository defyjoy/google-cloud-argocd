apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: airflow
  namespace: argocd
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/instance: airflow
    app.kubernetes.io/component: applicationset
    app.kubernetes.io/part-of: argocd-apps
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    # Cluster generator - automatically discovers clusters registered in ArgoCD
    - clusters:
        selector:
          matchLabels:
            # Deploy to clusters with this label
            airflow: "true"
        values:
          # Default values for all clusters
          environment: "production"
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-airflow"` }}
      namespace: argocd
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/instance: airflow
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: argocd-apps
        app.kubernetes.io/managed-by: Helm
        cluster: {{ `"{{name}}"` }}
        environment: production
      annotations:
        argocd.argoproj.io/managed: "true"
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/argocd-google-cloud.git
        targetRevision: HEAD
        path: helmcharts/airflow
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: {{ `"{{server}}"` }}
        namespace: airflow
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          annotations:
            argocd.argoproj.io/managed: "true"
          labels:
            name: "airflow"
            app.kubernetes.io/name: "airflow"
            pod-security.kubernetes.io/audit: "baseline"
            pod-security.kubernetes.io/enforce: "baseline"
            pod-security.kubernetes.io/warn: "baseline"
      # Ignore differences that are expected
      ignoreDifferences:
        # Service annotations may change
        - group: ""
          kind: Service
          jqPathExpressions:
            - .metadata.annotations
        # Secret data may change
        - group: ""
          kind: Secret
          jqPathExpressions:
            - .data
        # Deployment annotations may change
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .metadata.annotations
        # StatefulSet annotations may change
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .metadata.annotations
        # PersistentVolumeClaim may change
        - group: ""
          kind: PersistentVolumeClaim
          jqPathExpressions:
            - .status
      revisionHistoryLimit: 3

