apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argo-events
  namespace: argocd
  labels:
    app.kubernetes.io/name: argo-events
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          argo-events: "true"
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-argo-events"` }}
      namespace: argocd
      labels:
        app.kubernetes.io/name: argo-events
        cluster: {{ `"{{name}}"` }}
        environment: production
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/argocd-google-cloud.git
        targetRevision: HEAD
        path: helmcharts/argo-events
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: {{ `"{{server}}"` }}
        namespace: argo-events
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            name: "argo-events"
        retry:
          backoff:
            duration: 5s
            maxDuration: 3m
          limit: 5
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
      revisionHistoryLimit: 3
