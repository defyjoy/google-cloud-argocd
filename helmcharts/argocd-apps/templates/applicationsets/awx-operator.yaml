apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: awx-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: awx-operator
    app.kubernetes.io/instance: awx-operator
    app.kubernetes.io/component: applicationset
    app.kubernetes.io/part-of: argocd-apps
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "2"  # Deploy after core infrastructure
spec:
  generators:
    # Cluster generator - automatically discovers clusters registered in ArgoCD
    - clusters:
        selector:
          matchLabels:
            # Deploy to clusters with this label
            awx: "true"
        values:
          # Default values for all clusters
          environment: "production"
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-awx-operator"` }}
      namespace: argocd
      labels:
        app.kubernetes.io/name: awx-operator
        app.kubernetes.io/instance: awx-operator
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: argocd-apps
        app.kubernetes.io/managed-by: Helm
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{values.environment}}"` }}
      annotations:
        argocd.argoproj.io/managed: "true"
        argocd.argoproj.io/sync-wave: "2"  # Deploy after core infrastructure (waves -5..1)
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/google-cloud-argocd.git
        targetRevision: HEAD
        # Use kustomization manifests instead of helm chart
        path: manifests/awx-operator
      destination:
        server: {{ `"{{server}}"` }}
        namespace: awx-operator
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        managedNamespaceMetadata:
          labels:
            name: "awx-operator"
            pod-security.kubernetes.io/enforce: "privileged"
            pod-security.kubernetes.io/audit: "privileged"
            pod-security.kubernetes.io/warn: "privileged"
          annotations:
            argocd.argoproj.io/managed: "true"
        retry:
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
          limit: 5
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
      # Health assessment
      revisionHistoryLimit: 3
      ignoreDifferences:
        # Webhook caBundle may change during runtime
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        # CRD annotations may be modified by the operator
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.annotations
        # Deployment annotations may be modified by the operator
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .metadata.annotations
