# ClickStack ApplicationSet — operators + HyperDX / ClickHouse / MongoDB (single umbrella chart)
# Chart: helmcharts/clickstack
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clickstack
  namespace: argocd
  labels:
    app.kubernetes.io/name: clickstack
    app.kubernetes.io/component: applicationset
    app.kubernetes.io/part-of: argocd-apps
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            clickhouse: "true"
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-clickstack"` }}
      namespace: argocd
      labels:
        cluster: {{ `"{{name}}"` }}
        environment: production
        app.kubernetes.io/name: clickstack
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: argocd-apps
        app.kubernetes.io/managed-by: Helm
      annotations:
        argocd.argoproj.io/managed: "true"
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/google-cloud-argocd.git
        targetRevision: HEAD
        path: helmcharts/clickstack
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: {{ `"{{server}}"` }}
        namespace: clickhouse
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          annotations:
            argocd.argoproj.io/managed: "true"
          labels:
            name: "clickhouse"
            pod-security.kubernetes.io/audit: "privileged"
            pod-security.kubernetes.io/enforce: "privileged"
            pod-security.kubernetes.io/warn: "privileged"
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
        - group: ""
          kind: Service
          jqPathExpressions:
            - .metadata.annotations
        - group: ""
          kind: Secret
          jqPathExpressions:
            - .data
      revisionHistoryLimit: 3
