apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets-operator
  namespace: argocd
  annotations:
    # Immediately after argocd-apps (-29). ESO is a provider, not a consumer: it brings its own
    # CRDs and needs nothing from waves -20..3, while almost every later chart consumes the
    # Secrets it produces. At its old wave 4 it landed AFTER its consumers (vault -> 3,
    # zitadel -> 3, victoria-metrics -> 3), so first-install ExternalSecrets resolved against a
    # CRD/controller that did not exist yet.
    argocd.argoproj.io/sync-wave: "-25"
spec:
  generators:
    # Cluster generator - automatically discovers clusters registered in ArgoCD
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - dev
                - local

    # Alternative: List generator for explicit cluster definitions
    # Uncomment this and comment out the clusters generator above if you prefer explicit cluster list
    # - list:
    #     elements:
    #       - cluster: production
    #         url: https://kubernetes.default.svc
    #         environment: production
    #       - cluster: staging
    #         url: https://staging-cluster.example.com
    #         environment: staging
    #       - cluster: development
    #         url: https://dev-cluster.example.com
    #         environment: development

  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-external-secrets-operator"` }}
      namespace: argocd
      labels:
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{metadata.labels.environment}}"` }}
      annotations:
        argocd.argoproj.io/sync-wave: "-25"  # Aligns with ApplicationSet
        argocd.argoproj.io/manifest-generate-paths: "."
    spec:
      project: default

      source:
        repoURL: git@github.com:defyjoy/google-cloud-argocd.git
        targetRevision: HEAD
        path: helmcharts/external-secrets
        helm:
          # values.yaml (chart root) holds the shared defaults; values/<environment>.yaml
          # holds only the differential overrides for that environment, picked
          # automatically from the target cluster's `environment` label (set on the
          # cluster Secret, e.g. helmcharts/argocd/templates/cluster/local-cluster-secret.yaml
          # and .../dev-cluster-secret.yaml) -> values/local.yaml / values/dev.yaml.
          # ignoreMissingValueFiles lets a cluster sync fine even if no
          # values/<environment>.yaml override exists yet (e.g. local today, which needs
          # no overrides on top of the shared defaults).
          valueFiles:
            - values.yaml
            - {{ `"values/{{metadata.labels.environment}}.yaml"` }}
          ignoreMissingValueFiles: true

      destination:
        server: {{ `"{{server}}"` }}
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        
        # Managed namespace metadata - External Secrets Operator requires restricted access
        managedNamespaceMetadata:
          labels:
            # External Secrets Operator requires restricted access for security
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
            # Additional labels
            name: external-secrets
          annotations:
            # Optional: Add any namespace annotations here
            argocd.argoproj.io/managed: "true"
      
      # Health assessment
      revisionHistoryLimit: 3
      ignoreDifferences:
        # Webhook caBundle may change during runtime
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        # CRD annotations may be modified by the operator
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.annotations
        # Service annotations may be modified by the operator
        - group: ""
          kind: Service
          jqPathExpressions:
            - .metadata.annotations
        # Secret annotations may be modified by the operator
        - group: ""
          kind: Secret
          jqPathExpressions:
            - .metadata.annotations
        # ConfigMap annotations may be modified by the operator
        - group: ""
          kind: ConfigMap
          jqPathExpressions:
            - .metadata.annotations
        # Deployment annotations may be modified by the operator
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .metadata.annotations
        # ServiceAccount annotations may be modified by the operator
        - group: ""
          kind: ServiceAccount
          jqPathExpressions:
            - .metadata.annotations
        # Namespace annotations may be modified by the operator
        - group: ""
          kind: Namespace
          jqPathExpressions:
            - .metadata.annotations
