apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hashicorp-vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"  # Deploy after core infrastructure and monitoring
spec:
  generators:
    # Cluster generator - automatically discovers clusters registered in ArgoCD
    - clusters:
        selector:
          matchLabels:
            # Deploy to clusters with this label
            vault: "true"
        values:
          # Default values for all clusters
          environment: "production"
    
    # Alternative: List generator for explicit cluster definitions
    # Uncomment this and comment out the clusters generator above if you prefer explicit cluster list
    # - list:
    #     elements:
    #       - cluster: production
    #         url: https://kubernetes.default.svc
    #         environment: production
    #       - cluster: staging
    #         url: https://staging-cluster.example.com
    #         environment: staging
    #       - cluster: development
    #         url: https://dev-cluster.example.com
    #         environment: development

  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-vault"` }}
      namespace: argocd
      labels:
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{values.environment}}"` }}
      annotations:
        argocd.argoproj.io/sync-wave: "3"  # Deploy after core infrastructure and monitoring (aligns with ApplicationSet)
        argocd.argoproj.io/manifest-generate-paths: "."
    spec:
      project: default
      
      source:
        repoURL: git@github.com:defyjoy/google-cloud-argocd.git
        targetRevision: HEAD
        path: helmcharts/vault
        helm:
          # Use the default values.yaml from the helm chart
          valueFiles:
            - values.yaml
          # Optional: Add cluster-specific values files
          # Create these files in helmcharts/vault/values/<cluster-name>/values.yaml
          # - {{ `"values/{{name}}/values.yaml"` }}
          
          # Minimal parameter overrides (optional)
          # Use this only for cluster-specific simple overrides
          # For complex configs, use separate value files above
          parameters: []
            # - name: "vault.server.replicas"
            #   value: {{ `"{{values.replicaCount}}"` }}
            # - name: "vault.server.ingress.hosts[0].host"
            #   value: {{ `"vault-{{name}}.example.com"` }}
      
      destination:
        server: {{ `"{{server}}"` }}
        namespace: vault
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        
        # Managed namespace metadata - Vault requires privileged access
        managedNamespaceMetadata:
          labels:
            # Vault requires privileged access for security operations
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/warn: privileged
            # Additional labels
            name: vault
          annotations:
            # Optional: Add any namespace annotations here
            argocd.argoproj.io/managed: "true"
      
      # Health assessment
      revisionHistoryLimit: 3
      
      # Ignore differences that are expected
      ignoreDifferences:
        # StatefulSet volumeClaimTemplates may change during runtime
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
        # Vault server deployment may have runtime changes
        - group: apps
          kind: Deployment
          name: vault
          jqPathExpressions:
            - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef
        - group: apps
          kind: StatefulSet
          name: vault
          jqPathExpressions:
            - .spec.template.spec.containers[].env[]?.valueFrom.fieldRef
            - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef
        # Vault agent injector may have runtime changes
        - group: apps
          kind: Deployment
          name: vault-agent-injector
          jqPathExpressions:
            - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef
        # Webhook caBundle may change during runtime
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        # CRD annotations may be modified by the operator
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.annotations
        # Vault secrets may change during runtime
        - group: ""
          kind: Secret
          name: vault-unseal-keys
          jqPathExpressions:
            - .data
        - group: ""
          kind: Secret
          name: vault-tls
          jqPathExpressions:
            - .data
        # Vault config maps may have runtime changes
        - group: ""
          kind: ConfigMap
          name: vault-config
          jqPathExpressions:
            - .data
