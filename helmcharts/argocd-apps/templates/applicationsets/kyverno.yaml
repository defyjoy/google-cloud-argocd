apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno
  namespace: argocd
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/component: applicationset
    app.kubernetes.io/part-of: argocd-apps
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          kyverno: "true"
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-kyverno"` }}
      namespace: argocd
      labels:
        app.kubernetes.io/name: kyverno
        app.kubernetes.io/instance: kyverno
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: argocd-apps
        app.kubernetes.io/managed-by: Helm
        cluster: {{ `"{{name}}"` }}
        environment: production
      annotations:
        argocd.argoproj.io/managed: "true"
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/google-cloud-argocd.git
        targetRevision: HEAD
        path: helmcharts/kyverno
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: {{ `"{{server}}"` }}
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          annotations:
            argocd.argoproj.io/managed: "true"
          labels:
            name: "kyverno"
            pod-security.kubernetes.io/audit: "restricted"
            pod-security.kubernetes.io/enforce: "restricted"
            pod-security.kubernetes.io/warn: "restricted"
        retry:
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
          limit: 5
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
      revisionHistoryLimit: 3
      # The upstream `kyverno-api` subchart (alpha, github.com/kyverno/api) renders its CRDs with
      # empty metadata.labels/annotations ({}) instead of the standard chart label set the sibling
      # `crds` subchart uses, and omits spec.conversion (which the API server then defaults to
      # {strategy: None} on write). Both cause a permanent, harmless manifest-vs-live diff on the
      # policies.kyverno.io/* CRDs (ValidatingPolicy, MutatingPolicy, DeletingPolicy, etc.) that no
      # amount of re-syncing can resolve. Scoped by kind only since all Kyverno CRDs share the same
      # apiextensions.k8s.io group/CustomResourceDefinition kind; harmless no-op for the CRDs that
      # already match.
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /metadata/labels
            - /metadata/annotations
            - /spec/conversion
