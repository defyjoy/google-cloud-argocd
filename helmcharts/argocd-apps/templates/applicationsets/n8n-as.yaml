apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: n8n
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"  # Deploy after core infrastructure
spec:
  generators:
    # Cluster generator - automatically discovers clusters registered in ArgoCD
    - clusters:
        selector:
          matchLabels:
            # Deploy to clusters with this label
            n8n: "true"
        values:
          # Default values for all clusters
          environment: "production"
    
    # Alternative: List generator for explicit cluster definitions
    # Uncomment this and comment out the clusters generator above if you prefer explicit cluster list
    # - list:
    #     elements:
    #       - cluster: production
    #         url: https://kubernetes.default.svc
    #         environment: production
    #       - cluster: staging
    #         url: https://staging-cluster.example.com
    #         environment: staging
    #       - cluster: development
    #         url: https://dev-cluster.example.com
    #         environment: development

  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-n8n"` }}
      namespace: argocd
      labels:
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{values.environment}}"` }}
      annotations:
        argocd.argoproj.io/manifest-generate-paths: "."
    spec:
      project: default
      
      source:
        repoURL: git@github.com:defyjoy/google-cloud-argocd.git
        targetRevision: HEAD
        path: helmcharts/n8n
        helm:
          # Use the default values.yaml from the helm chart
          valueFiles:
            - values.yaml
          # Optional: Add cluster-specific values files
          # Create these files in helmcharts/n8n/values/<cluster-name>/values.yaml
          # - {{ `"values/{{name}}/values.yaml"` }}
          
          # Minimal parameter overrides (optional)
          # Use this only for cluster-specific simple overrides
          # For complex configs, use separate value files above
          parameters: []
            # - name: "n8n.replicaCount"
            #   value: {{ `"{{values.replicaCount}}"` }}
            # - name: "n8n.ingress.hosts[0].host"
            #   value: {{ `"{{values.hostname}}"` }}
      
      destination:
        server: {{ `"{{server}}"` }}
        namespace: n8n
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        
        # Managed namespace metadata
        managedNamespaceMetadata:
          labels:
            # N8N runs in restricted mode
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
            # Additional labels
            name: n8n
          annotations:
            # Optional: Add any namespace annotations here
            argocd.argoproj.io/managed: "true"
      
      # Health assessment
      revisionHistoryLimit: 3
      
      # Ignore differences that are expected
      ignoreDifferences:
        # N8N deployment may have runtime changes
        - group: apps
          kind: Deployment
          name: n8n
          jqPathExpressions:
            - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef
        # Webhook caBundle may change during runtime
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        # CRD annotations may be modified by the operator
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.annotations
