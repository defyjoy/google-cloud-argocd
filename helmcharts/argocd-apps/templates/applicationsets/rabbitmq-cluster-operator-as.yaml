apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rabbitmq-cluster-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: rabbitmq-cluster-operator
    app.kubernetes.io/instance: rabbitmq-cluster-operator
    app.kubernetes.io/component: applicationset
    app.kubernetes.io/part-of: argocd-apps
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "2"  # Deploy after core infrastructure
spec:
  generators:
    # Cluster generator - automatically discovers clusters registered in ArgoCD
    - clusters:
        selector:
          matchLabels:
            # Deploy to clusters with this label
            rabbitmq-cluster-operator: "true"
        values:
          # Default values for all clusters
          environment: "production"
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-rabbitmq-cluster-operator"` }}
      namespace: argocd
      labels:
        app.kubernetes.io/name: rabbitmq-cluster-operator
        app.kubernetes.io/instance: rabbitmq-cluster-operator
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: argocd-apps
        app.kubernetes.io/managed-by: Helm
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{values.environment}}"` }}
      annotations:
        argocd.argoproj.io/managed: "true"
        argocd.argoproj.io/manifest-generate-paths: "."
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/argocd-google-cloud.git
        targetRevision: HEAD
        path: manifests/rabbitmq-operator
      destination:
        server: {{ `"{{server}}"` }}
        namespace: rabbitmq-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          labels:
            name: "rabbitmq-system"
            pod-security.kubernetes.io/enforce: "privileged"
            pod-security.kubernetes.io/audit: "privileged"
            pod-security.kubernetes.io/warn: "privileged"
          annotations:
            argocd.argoproj.io/managed: "true"
      revisionHistoryLimit: 3
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle

