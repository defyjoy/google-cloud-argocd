apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tailscale
  namespace: argocd
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/instance: tailscale
    app.kubernetes.io/component: applicationset
    app.kubernetes.io/part-of: argocd-apps
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "2"  # Deploy after core infrastructure
spec:
  generators:
    # Cluster generator - automatically discovers clusters registered in ArgoCD
    - clusters:
        selector:
          matchLabels:
            # Deploy to clusters with this label
            tailscale: "true"
        values:
          # Default values for all clusters
          environment: "production"
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-tailscale"` }}
      namespace: argocd
      labels:
        app.kubernetes.io/name: tailscale
        app.kubernetes.io/instance: tailscale
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: argocd-apps
        app.kubernetes.io/managed-by: Helm
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{values.environment}}"` }}
      annotations:
        argocd.argoproj.io/managed: "true"
        argocd.argoproj.io/sync-wave: "2"  # Deploy after core infrastructure
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/google-cloud-argocd.git
        targetRevision: HEAD
        path: helmcharts/tailscale
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: {{ `"{{server}}"` }}
        namespace: tailscale
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        managedNamespaceMetadata:
          labels:
            name: "tailscale"
            # Tailscale requires privileged access for network operations
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/warn: privileged
          annotations:
            argocd.argoproj.io/managed: "true"
        retry:
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
          limit: 5
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
      # Health assessment
      revisionHistoryLimit: 3
      ignoreDifferences:
        # Deployment may have runtime changes
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef
        - group: apps
          kind: DaemonSet
          jqPathExpressions:
            - .spec.template.spec.containers[].env[]?.valueFrom.fieldRef
            - .spec.template.spec.containers[].env[]?.valueFrom.resourceFieldRef

