# Vault backup ApplicationSet
# Daily Raft snapshot + full KV (all versions) export to S3. Management-only —
# Vault HA lives on management (environment: local); no values/dev.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vault-backup
  namespace: argocd
  annotations:
    # After Vault (wave 3) and External Secrets (wave 4) — needs Vault API +
    # ClusterSecretStore for S3 credentials.
    argocd.argoproj.io/sync-wave: "5"
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            - key: environment
              operator: In
              values:
                - local
            - key: vault-backup
              operator: In
              values:
                - "true"

  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-vault-backup"` }}
      namespace: argocd
      labels:
        cluster: {{ `"{{name}}"` }}
        environment: {{ `"{{metadata.labels.environment}}"` }}
      annotations:
        argocd.argoproj.io/manifest-generate-paths: "."
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: default

      source:
        repoURL: git@github.com:defyjoy/google-cloud-argocd.git
        targetRevision: HEAD
        path: helmcharts/vault-backup
        helm:
          valueFiles:
            - values.yaml
            - {{ `"values/{{metadata.labels.environment}}.yaml"` }}
          ignoreMissingValueFiles: true

      destination:
        server: {{ `"{{server}}"` }}
        namespace: vault-backup

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        managedNamespaceMetadata:
          labels:
            # baseline: backup job needs uid 0 briefly for apk (jq/unzip); still
            # drops ALL capabilities. Restricted would reject runAsUser: 0.
            pod-security.kubernetes.io/enforce: baseline
            pod-security.kubernetes.io/audit: baseline
            pod-security.kubernetes.io/warn: baseline
            name: vault-backup
          annotations:
            argocd.argoproj.io/managed: "true"
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground

        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      revisionHistoryLimit: 3
