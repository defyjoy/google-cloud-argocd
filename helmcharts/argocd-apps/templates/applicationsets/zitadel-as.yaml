apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: zitadel
  namespace: argocd
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/instance: zitadel
    app.kubernetes.io/component: applicationset
    app.kubernetes.io/part-of: argocd-apps
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "3"  # After cloudnative-pg (wave 1) and envoy-gateway/stepca (waves 2-3)
spec:
  generators:
  - clusters:
      selector:
        matchLabels:
          zitadel: "true"
  syncPolicy:
    applicationsSync: sync
    preserveResourcesOnDeletion: false

  template:
    metadata:
      name: {{ `"{{name}}-zitadel"` }}
      namespace: argocd
      labels:
        app.kubernetes.io/name: zitadel
        app.kubernetes.io/instance: zitadel
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: argocd-apps
        app.kubernetes.io/managed-by: Helm
        cluster: {{ `"{{name}}"` }}
        environment: production
      annotations:
        argocd.argoproj.io/managed: "true"
        argocd.argoproj.io/sync-wave: "3"
        # Gateway API CRD defaults (backendRefs weight/group/kind, parentRefs group/kind)
        # make the HTTPRoutes perpetually OutOfSync under the client-side differ when
        # syncing with ServerSideApply (no last-applied annotation to fall back on).
        # Server-side diff computes the comparison via an SSA dry-run instead.
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    spec:
      project: default
      source:
        repoURL: git@github.com:defyjoy/argocd-google-cloud.git
        targetRevision: HEAD
        path: helmcharts/zitadel
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: {{ `"{{server}}"` }}
        namespace: zitadel
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        managedNamespaceMetadata:
          annotations:
            argocd.argoproj.io/managed: "true"
          labels:
            name: "zitadel"
            pod-security.kubernetes.io/audit: "restricted"
            pod-security.kubernetes.io/enforce: "baseline"
            pod-security.kubernetes.io/warn: "restricted"
      ignoreDifferences:
        # The setup job writes machine-key / PAT secrets imperatively via kubectl;
        # the masterkey secret is immutable after install.
        - group: ""
          kind: Secret
          jqPathExpressions:
            - .metadata.annotations
      revisionHistoryLimit: 3
