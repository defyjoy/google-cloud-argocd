# Bootstrap manifest for registering the `dev` cluster (defyjoy/proxmox-talos,
# terraform/envs/dev) with this Argo CD instance running in `management`.
#
# This is NOT synced by Argo CD — it must be applied manually, ONCE, directly
# against the dev cluster itself, before Argo CD can ever reach it (chicken-and-
# egg: Argo CD needs this ServiceAccount to exist on dev before it can register
# dev as a cluster target).
#
#   kubectl apply -f dev-cluster-serviceaccount.yaml --kubeconfig ~/.kube/talos-dev.yaml
#
# After applying, generate a long-lived bearer token (Kubernetes 1.24+ no longer
# auto-creates ServiceAccount token Secrets):
#
#   kubectl create token argocd-manager -n kube-system \
#     --kubeconfig ~/.kube/talos-dev.yaml --duration=87600h
#
# That token + dev's cluster CA data (from ~/.kube/talos-dev.yaml) are the two
# fields written to Vault at kv mount, argocd/dev-cluster, consumed by
# helmcharts/argocd/templates/cluster/dev-cluster-secret.yaml.
#
# RBAC scope mirrors Argo CD's own official recommended manifest for
# `argocd-manager` (full access — Argo CD must be able to deploy arbitrary
# resource types, so this is intentionally not scoped down further).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-manager-role
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"
  - nonResourceURLs:
      - "*"
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-manager-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-manager-role
subjects:
  - kind: ServiceAccount
    name: argocd-manager
    namespace: kube-system
