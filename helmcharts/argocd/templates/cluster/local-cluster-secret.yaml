apiVersion: v1
kind: Secret
metadata:
  name: local
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cluster-name: local
    environment: local

    app.kubernetes.io/name: local-cluster
    app.kubernetes.io/component: cluster-secret
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/managed-by: Helm

    ## Gateway API CRDs are installed and versioned by GKE itself, once the cluster is created
    ## or updated with `--gateway-api=standard`. The helmcharts/gateway-api-crds chart installs
    ## the UPSTREAM v1.5.1 experimental manifest, which would overwrite GKE's own CRDs and break
    ## the managed controller. The two are mutually exclusive — leave this off on GKE.
    # gateway-api-crds: "true"
    gke-gateway: "true"

    ## Cilium is NOT deployed on GKE. This cluster already runs Calico (Dataplane V1), and
    ## helmcharts/cilium is Talos-shaped: k8sServiceHost localhost:7445 is Talos KubePrism,
    ## kubeProxyReplacement fights GKE's own kube-proxy, and the LB pool is a Proxmox LAN range
    ## (192.168.3.0/24) with no meaning in this VPC. Turning this on schedules a CNI fight at
    ## sync-wave -20 with selfHeal, i.e. permanently.
    # cilium: "true"
    cert-manager: "true"
    vault: "true"
    vault-backup: "true"
    external-secrets: "true"
    clickhouse: "false"
    cloudnative-pg: "true"
    nats: "true"
    kube-prometheus-stack: "true"
    harbor: "true"
    zitadel: "true"
    external-dns: "true"
    kyverno: "true"
    victoria-metrics-operator: "true"
    victoria-metrics: "true"
    tempo: "true"
    # staypingo-admin-api: "true"
    # staypingo-admin-ui: "true"

    ## Never deployed on any cluster -- these two were previously carried in `data.labels`,
    ## which Argo CD's cluster generator does not read (it selects on metadata.labels only),
    ## so their ApplicationSets have always matched zero clusters. Charts are still current
    ## (helmcharts/airflow, helmcharts/argo-workflows). Uncomment to actually deploy.
    # airflow: "true"
    # argo-workflows: "true"
  annotations:
    argocd.argoproj.io/managed: "true"
type: Opaque
data:
  server: {{ printf "https://kubernetes.default.svc" | b64enc }}
  name: {{ printf "local" | b64enc }}
  tlsServerName: {{ printf "kubernetes.default.svc" | b64enc }}
  config: {{ printf `{"tlsClientConfig":{"insecure":false}}` | b64enc }}
