{{- if .Values.corednsKubeSystem.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    {{ .Values.corednsKubeSystem.lanZone }}:53 {
        errors
        log . {
            class error
        }
        hosts {
            {{- range .Values.corednsKubeSystem.hosts }}
            {{ .ip }} {{ .hostname }}
            {{- end }}
            fallthrough
        }
        cache 300
    }

    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . {{ .Values.corednsKubeSystem.upstream }} {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
{{- end }}
