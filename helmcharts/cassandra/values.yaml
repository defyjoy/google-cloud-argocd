enabled: true

cassandra:
  image:
    registry: docker.io
    repository: bitnami/cassandra
    tag: "4.1.4"
    pullPolicy: IfNotPresent

  replicaCount: 3

  service:
    type: ClusterIP
    port: 9042

  ingress:
    enabled: false
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: cassandra.jrclabs.xyz
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: cassandra-tls
        hosts:
          - cassandra.jrclabs.xyz

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    privileged: false
    seccompProfile:
      type: RuntimeDefault

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce

  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "500m"

  nodeSelector: {}

  tolerations: []

  affinity: {}

  serviceAccount:
    create: true
    name: cassandra

  rbac:
    create: true

  config:
    clusterName: "cassandra-cluster"
    numTokens: 256
    initialToken: ""
    concurrentReads: 32
    concurrentWrites: 32
    concurrentCounterWrites: 32
