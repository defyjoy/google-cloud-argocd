apiVersion: v2
name: clickstack
description: >-
  ClickStack umbrella — MongoDB + ClickHouse operators and ClickStack (HyperDX + ClickHouse + optional OTel)
  in one release. Wraps official charts from ClickStack Helm.

type: application

# Chart version — bump when this wrapper or its templates change.
version: 0.3.1

# Aligns with upstream clickstack application (HyperDX) image tag family.
appVersion: "2.22.0"

# https://clickhouse.com/docs/use-cases/observability/clickstack/deployment/helm
# Install order: operators first (CRDs + controllers), then ClickStack workloads.
dependencies:
  - name: clickstack-operators
    version: 1.0.0
    repository: https://clickhouse.github.io/ClickStack-helm-charts
    condition: clickhouse.enabled

  - name: clickstack
    version: "2.1.1"
    repository: https://clickhouse.github.io/ClickStack-helm-charts
    condition: clickhouse.enabled
