apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: cloudflared
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: cloudflared
    app.kubernetes.io/managed-by: Helm
    external-secrets.io/component: externalsecret
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  # Refresh interval for syncing secrets
  refreshInterval: 1h
  
  # Secret store reference - points to vault ClusterSecretStore
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  
  # Target secret configuration
  target:
    name: cloudflared-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        annotations:
          external-secrets.io/managed-by: external-secrets
        labels:
          app.kubernetes.io/component: credentials
          app.kubernetes.io/instance: cloudflared
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/name: cloudflared
          app.kubernetes.io/part-of: cloudflared
  
  # Secret data mapping from Vault
  data:
    - secretKey: cert.pem
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .Values.externalSecrets.vaultPath | quote }}
        metadataPolicy: None
        property: cert
    - secretKey: credentials.json
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .Values.externalSecrets.vaultPath | quote }}
        metadataPolicy: None
        property: credentials
  