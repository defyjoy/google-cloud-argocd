apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: postgresql-cluster-rw
  namespace: cloudnative-pg-system
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  # In-cluster DB clients (zitadel) resolve postgresql-cluster-rw.cloudnative-pg-system.svc
  # directly and must NOT hairpin through this route. It exists for low-churn external clients
  # only.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: gateway-system
      sectionName: postgres
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: postgresql-cluster-rw
          port: 5432
          weight: 1
