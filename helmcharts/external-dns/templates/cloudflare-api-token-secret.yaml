{{- if .Values.cloudflareApiToken }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/instance: external-dns
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: external-dns
    app.kubernetes.io/managed-by: Helm
    external-secrets.io/component: externalsecret
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  # Refresh interval for syncing secrets
  refreshInterval: 1h
  
  # Secret store reference - points to vault ClusterSecretStore
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  
  # Target secret configuration
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        annotations:
          external-secrets.io/managed-by: external-secrets
        labels:
          app.kubernetes.io/component: credentials
          app.kubernetes.io/instance: external-dns
          app.kubernetes.io/managed-by: Helm
          app.kubernetes.io/name: external-dns
          app.kubernetes.io/part-of: external-dns
  
  # Secret data mapping from Vault
  data:
    - secretKey: api-token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ .Values.cloudflareApiToken.vaultPath }}
        metadataPolicy: None
        property: token
{{- end }}
