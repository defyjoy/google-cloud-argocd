enabled: true

vaultClusterSecretStore:
  enabled: true
  vault:
    server: "http://local-vault.vault.svc.cluster.local:8200"
    path: "kv"
    version: "v2"
  tokenSecret:
    name: vault-token
    key: token
    namespace: external-secrets
  retrySettings:
    maxRetries: 3
    retryInterval: 5m

external-secrets:
  global:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - NET_BIND_SERVICE
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault

  installCRDs: true

  namespace:
    name: "external-secrets"
    create: true
    labels:
      name: "external-secrets"
      pod-security.kubernetes.io/enforce: "restricted"
      pod-security.kubernetes.io/audit: "restricted"
      pod-security.kubernetes.io/warn: "restricted"
    annotations:
      argocd.argoproj.io/managed: "true"

  externalSecrets:
    image:
      repository: external-secrets/external-secrets
      tag: "v0.10.0"
      pullPolicy: IfNotPresent

    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

    service:
      type: ClusterIP
      port: 8080
      targetPort: 8080

    metrics:
      enabled: true
      service:
        type: ClusterIP
        port: 8080
        targetPort: 8080
      serviceMonitor:
        enabled: false
        namespace: "external-secrets"
        namespaceSelector: {}
        scrapeInterval: 30s
        scrapeTimeout: 10s
        labels:
          prometheus-scrape: "enabled"

    webhook:
      enabled: true
      image:
        repository: external-secrets/external-secrets-webhook
        tag: "v0.10.0"
        pullPolicy: IfNotPresent

      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

      service:
        type: ClusterIP
        port: 443
        targetPort: 9443

      config:
        certManager:
          enabled: true
          issuer:
            kind: ClusterIssuer
            name: selfsigned-issuer

        webhook:
          port: 9443
          hostNetwork: false

    rbac:
      create: true
      serviceAccount:
        create: true
        name: external-secrets
        annotations:
          argocd.argoproj.io/managed: "true"

    security:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault

    nodeSelector: {}
    tolerations: []
    affinity: {}

    priorityClassName: ""

    env: []

    logLevel: info
    logFormat: json

    leaderElection:
      enabled: true
      leaseDuration: "15s"
      renewDeadline: "10s"
      retryPeriod: "2s"

    concurrentReconciles: 1

    healthCheck:
      enabled: true
      port: 8081
      path: "/healthz"

    readyCheck:
      enabled: true
      port: 8081
      path: "/readyz"

    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1

    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1

    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
      successThreshold: 1

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    networkPolicy:
      enabled: false

    podAnnotations: {}

    podLabels: {}

    serviceAnnotations: {}

    serviceLabels: {}

    ingress:
      enabled: false
      className: ""
      annotations: {}
      hosts: []
      tls: []

    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80

    vpa:
      enabled: false

    podMonitor:
      enabled: false
      namespace: "external-secrets"
      namespaceSelector: {}
      scrapeInterval: 30s
      scrapeTimeout: 10s
      labels:
        prometheus-scrape: "enabled"

    serviceMonitor:
      enabled: false
      namespace: "external-secrets"
      namespaceSelector: {}
      scrapeInterval: 30s
      scrapeTimeout: 10s
      labels:
        prometheus-scrape: "enabled"

    prometheusRule:
      enabled: true
      namespace: "external-secrets"
      labels: {}
      rules: []

    grafanaDashboard:
      enabled: false
      namespace: "external-secrets"
      labels: {}

    certManager:
      enabled: true
      issuer:
        kind: ClusterIssuer
        name: selfsigned-issuer

    crds:
      install: true
      upgrade: true
      uninstall: true

    featureGates: []

    volumes: []

    volumeMounts: []

    extraContainers: []

    initContainers: []

    sidecars: []

    extraEnv: []

    extraEnvFrom: []

    extraLabels: {}

    extraAnnotations: {}

    extraSelectors: {}

    extraTolerations: []

    extraNodeSelectors: {}

    extraAffinity: {}

    extraSecurityContext: {}

    extraContainerSecurityContext: {}

    extraResources: {}

    extraPorts: []

    extraServices: []

    extraIngresses: []

    extraConfigMaps: []

    extraSecrets: []

    extraServiceAccounts: []

    extraClusterRoles: []

    extraClusterRoleBindings: []

    extraRoles: []

    extraRoleBindings: []

    extraNetworkPolicies: []

    extraPodDisruptionBudgets: []

    extraHorizontalPodAutoscalers: []

    extraVerticalPodAutoscalers: []

    extraPodMonitors: []

    extraServiceMonitors: []

    extraPrometheusRules: []

    extraGrafanaDashboards: []

    extraCertManagerIssuers: []

    extraCertManagerCertificates: []

    extraCertManagerCertificateRequests: []

    extraCertManagerOrders: []

    extraCertManagerChallenges: []

    extraCertManagerClusterIssuers: []

    extraCertManagerClusterIssuerSpecs: []

    extraCertManagerIssuerSpecs: []

    extraCertManagerCertificateSpecs: []

    extraCertManagerCertificateRequestSpecs: []

    extraCertManagerOrderSpecs: []

    extraCertManagerChallengeSpecs: []

    extraCertManagerClusterIssuerSpecs: []

    extraCertManagerIssuerSpecs: []

    extraCertManagerCertificateSpecs: []

    extraCertManagerCertificateRequestSpecs: []

    extraCertManagerOrderSpecs: []

    extraCertManagerChallengeSpecs: []
