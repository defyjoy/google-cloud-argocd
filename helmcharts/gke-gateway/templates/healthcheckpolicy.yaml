{{- /*
  Optional overrides for the load balancer health check. GKE normally derives the health check
  from the backend Pod's readiness probe, which is correct for argocd-server, so this list is
  EMPTY by default.

  A HealthCheckPolicy targets a Service, not a Gateway, so these are deliberately NOT nested
  under `gateways` — a backend reached through both gateways needs one policy, not two.

  Add one only when a backend's readiness probe and its LB-facing health endpoint differ:

    healthCheckPolicies:
      - name: argocd-server
        targetService: argocd-server
        namespace: argocd
        port: 8080
        requestPath: /healthz
*/ -}}
{{- range .Values.healthCheckPolicies }}
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ .name }}-healthcheck
  namespace: {{ .namespace | default $.Values.namespace.name }}
  labels:
    app.kubernetes.io/name: gke-gateway
    app.kubernetes.io/component: healthcheck
    app.kubernetes.io/managed-by: Helm
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: {{ .port }}
        requestPath: {{ .requestPath | quote }}
  targetRef:
    group: ""
    kind: Service
    name: {{ .targetService }}
{{- end }}
