{{- /*
  Origin-side HTTP->HTTPS redirect, one HTTPRoute per gateway scope that has hosts listed. Only
  safe once Cloudflare's SSL mode for the zone is Full/Full(strict) -- in Flexible mode Cloudflare
  always talks plain HTTP to the origin, so an origin-side redirect would just bounce the client
  back through the edge forever. Each host's own HTTPRoute must attach to that gateway's https
  listener only (not http) once it's added here, or this route and that one both try to own the
  host on the http listener.
*/ -}}
{{- range $scope, $hosts := .Values.httpRedirectHosts }}
{{- if $hosts }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect-{{ $scope }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app.kubernetes.io/name: gke-gateway
    app.kubernetes.io/component: http-redirect
    app.kubernetes.io/managed-by: Helm
spec:
  hostnames:
    {{- toYaml $hosts | nindent 4 }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ (index $.Values.gateways $scope).name }}
      namespace: {{ $.Values.namespace.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
