harbor:
  enabled: true
  expose:
    type: route
    tls:
      enabled: true
      certSource: none
    route:
      labels:
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: core
      annotations:
        external-dns.alpha.kubernetes.io/hostname: harbor.workquark.org
        external-dns.alpha.kubernetes.io/class: cloudflare
      parentRefs:
        - name: gateway
          namespace: gateway-system
          group: gateway.networking.k8s.io
          kind: Gateway
          sectionName: http
      hosts:
        - harbor.workquark.org
        - harbor.home.arpa

  externalURL: https://harbor.workquark.org

  registry:
    relativeurls: true
    replicas: 1

  persistence:
    enabled: true
    imageChartStorage:
      type: filesystem
      filesystem:
        rootdirectory: /storage
    persistentVolumeClaim:
      registry:
        existingClaim: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 4Gi
      chartmuseum:
        existingClaim: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 2Gi
      jobservice:
        jobLog:
          existingClaim: ""
          subPath: ""
          accessMode: ReadWriteOnce
          size: 2Gi
          annotations: {}
      database:
        existingClaim: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 2Gi
      redis:
        existingClaim: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 2Gi
      trivy:
        existingClaim: ""
        subPath: ""
        accessMode: ReadWriteOnce
        size: 2Gi

  harborAdminPassword: "admin123"
  secretKey: "harborkey"

  database:
    type: internal
    internal:
      password: "change-me"
      maxIdleConns: 50
      maxOpenConns: 1000
    external:
      host: "cloudnative-pg.cloudnative-pg.svc.cluster.local"
      port: "5432"
      username: "postgres"
      password: "postgres-change-me-in-production"
      database: "registry"
      sslMode: "disable"

  redis:
    type: internal
    internal:
      password: ""
    external:
      addr: "192.168.1.3:6379"
      password: ""

  trivy:
    enabled: true
    ignoreUnfixed: false
    skipUpdate: false
    offlineScan: false
    securityCheck: "vuln"
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        cpu: 100m
        memory: 1Gi

  notary:
    enabled: true

  resources:
    core:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 400m
        memory: 1024Mi
    jobservice:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 400m
        memory: 1024Mi
    registry:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

  logLevel: info

  metrics:
    enabled: true
    core:
      path: /metrics
      port: 8001
    registry:
      path: /metrics
      port: 8001
    exporter:
      path: /metrics
      port: 8001

  updateStrategy:
    type: Recreate
