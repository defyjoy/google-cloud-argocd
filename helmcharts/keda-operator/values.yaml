enabled: true

keda:
  operator:
    replicas: 1
    image:
      repository: ghcr.io/kedacore/keda
      tag: "2.12.2"
      pullPolicy: IfNotPresent

  metricsServer:
    replicas: 1
    image:
      repository: ghcr.io/kedacore/keda-metrics-apiserver
      tag: "2.12.2"
      pullPolicy: IfNotPresent

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    privileged: false
    seccompProfile:
      type: RuntimeDefault

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"

  nodeSelector: {}

  tolerations: []

  affinity: {}

  serviceAccount:
    create: true
    name: keda

  rbac:
    create: true
