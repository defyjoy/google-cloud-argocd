{{- /*
Zitadel OAuth2 credentials for the Alarmify ingestion receiver. Creates the
`alarmify-oauth` secret mounted by Alertmanager (alertmanagerSpec.secrets)
from Vault path alarmify/management/alertmanager-oauth (field: client-secret).
Full flow: OIDC.md.
*/ -}}
{{- $kps := index .Values "kube-prometheus-stack" }}
{{- $oauth := $kps.alertmanager.alarmifyOauth | default dict }}
{{- if $oauth.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alarmify-oauth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: alarmify-ingestion
    app.kubernetes.io/instance: alertmanager
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $oauth.externalSecret.secretStore | default "vault-secretstore" }}
    kind: ClusterSecretStore
  target:
    name: alarmify-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $oauth.externalSecret.vaultPath | quote }}
        property: client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
