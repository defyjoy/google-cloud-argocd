{{- if .Values.argocdDashboards.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-prometheus-stack.fullname" . }}-argocd-application-overview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    {{- toYaml .Values.argocdDashboards.annotations | nindent 4 }}
data:
  argo-cd-application-overview.json: |-
{{ .Files.Get "dashboards/argo-cd-application-overview.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-prometheus-stack.fullname" . }}-argocd-notifications-overview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    {{- toYaml .Values.argocdDashboards.annotations | nindent 4 }}
data:
  argo-cd-notifications-overview.json: |-
{{ .Files.Get "dashboards/argo-cd-notifications-overview.json" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-prometheus-stack.fullname" . }}-argocd-operational-overview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    {{- toYaml .Values.argocdDashboards.annotations | nindent 4 }}
data:
  argo-cd-operational-overview.json: |-
{{ .Files.Get "dashboards/argo-cd-operational-overview.json" | indent 4 }}
{{- end }}

