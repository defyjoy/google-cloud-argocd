{{- /*
Zitadel OIDC credentials for Grafana's generic_oauth login. Creates the
`grafana-oidc` secret that Grafana reads via envValueFrom (GF_AUTH_GENERIC_OAUTH_*).
Sourced from the Terraform-owned Vault object alarmify/management/zitadel, one
named property per key -- never `extract`, that object is shared.
Full flow: GRAFANA-OIDC.md.
*/ -}}
{{- $kps := index .Values "kube-prometheus-stack" }}
{{- $oidc := ($kps.grafana).alarmifyOidc | default dict }}
{{- $es := $oidc.externalSecret | default dict }}
{{- if $oidc.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: credentials
    app.kubernetes.io/instance: grafana
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $es.secretStore | default "vault-secretstore" }}
    kind: ClusterSecretStore
  target:
    name: {{ $es.secretName | default "grafana-oidc" }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ $es.vaultPath | quote }}
        property: {{ $es.clientIdProperty | default "ZITADEL_GRAFANA_CLIENT_ID" }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: client-secret
      remoteRef:
        key: {{ $es.vaultPath | quote }}
        property: {{ $es.clientSecretProperty | default "ZITADEL_GRAFANA_CLIENT_SECRET" }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
