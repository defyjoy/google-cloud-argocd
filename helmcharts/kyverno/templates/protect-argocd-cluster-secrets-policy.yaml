{{- if .Values.policies.protectArgocdClusterSecrets.enabled }}
# Blocks direct kubectl label/edit/delete on ArgoCD cluster-registration secrets
# (argocd.argoproj.io/secret-type: cluster). These secrets drive ApplicationSet
# cluster generators (see helmcharts/argocd-apps/templates/applicationsets/*-as.yaml)
# purely off their live labels, so an out-of-band `kubectl label` survives ArgoCD's
# own selfHeal: with ServerSideApply, the argocd-application-controller field manager
# only owns the label keys present in git, and un-owned map keys added by another
# manager are merged, not pruned. Only the controller's own ServiceAccount is
# excluded here; everyone else must go through git + ArgoCD sync.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: protect-argocd-cluster-secrets
  annotations:
    policies.kyverno.io/title: Protect ArgoCD Cluster Secrets
    policies.kyverno.io/category: ArgoCD
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Denies UPDATE/DELETE on ArgoCD cluster-registration Secrets
      (argocd.argoproj.io/secret-type: cluster) in the argocd namespace from
      any identity other than the argocd-application-controller ServiceAccount.
      These secrets must only change via git + ArgoCD sync.
spec:
  validationFailureAction: {{ .Values.policies.protectArgocdClusterSecrets.validationFailureAction }}
  background: false
  rules:
    - name: block-non-gitops-writes
      match:
        any:
          - resources:
              kinds: ["Secret"]
              namespaces: ["{{ .Values.policies.protectArgocdClusterSecrets.argocdNamespace }}"]
              selector:
                matchLabels:
                  argocd.argoproj.io/secret-type: cluster
              operations: ["UPDATE", "DELETE"]
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: {{ .Values.policies.protectArgocdClusterSecrets.argocdControllerServiceAccount }}
                namespace: {{ .Values.policies.protectArgocdClusterSecrets.argocdNamespace }}
      # skipBackgroundRequests/allowExistingViolations are set explicitly to
      # match the kyverno CRD's own OpenAPI defaults (both default to `true`).
      # The apiserver injects these defaults into the live object on every
      # write regardless of what's in git, so omitting them here makes
      # ArgoCD see a perpetual, unfixable diff between live and desired state.
      skipBackgroundRequests: true
      validate:
        allowExistingViolations: true
        message: >-
          ArgoCD cluster-registration secrets are GitOps-managed
          (helmcharts/argocd/templates/cluster/*.yaml). Direct kubectl
          label/edit/delete is blocked — change the label/config in git
          and let ArgoCD sync it.
        deny: {}
{{- end }}
