apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: nats-tcproute
  namespace: nats
  labels:
    app.kubernetes.io/name: nats-tcproute
    app.kubernetes.io/component: tcproute
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: gateway-system
      sectionName: nats
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: local-nats
          port: 4222
          weight: 1
