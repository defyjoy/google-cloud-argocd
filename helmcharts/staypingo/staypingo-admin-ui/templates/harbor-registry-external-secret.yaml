# Pull credentials for Harbor (dockerconfigjson). Requires ClusterSecretStore `vault-secretstore`.
# Vault KV example (robot creds from kv/harbor/secret → dockerconfig for harbor.jrclabs.xyz):
#   USER=$(vault kv get -field=user kv/harbor/secret)
#   TOKEN=$(vault kv get -field=token kv/harbor/secret)
#   # build dockerconfig.json with auths for harbor.jrclabs.xyz, then:
#   vault kv put kv/harbor/staypingo-registry-credential .dockerconfigjson=@dockerconfig.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
  labels:
    app.kubernetes.io/name: staypingo-admin-ui
    app.kubernetes.io/part-of: staypingo
    app.kubernetes.io/component: staypingo-admin-ui
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secretstore
    kind: ClusterSecretStore
  target:
    name: staypingo-admin-ui-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/name: staypingo-admin-ui
          app.kubernetes.io/component: credentials
          app.kubernetes.io/part-of: staypingo
          app.kubernetes.io/managed-by: kustomize
        annotations:
          external-secrets.io/managed-by: external-secrets
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: harbor/staypingo-registry-credential
        property: .dockerconfigjson
        metadataPolicy: None
