enabled: true

superset:
  serviceAccount:
    create: true
    annotations: {}

  runAsUser: 1000

  secretEnv:
    create: true

  image:
    repository: apache/superset
    pullPolicy: IfNotPresent

  workers:
    replicas: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  web:
    replicas: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"

  ingress:
    enabled: false
    ingressClassName: nginx
    annotations: {}
    hosts:
      - host: superset.workquark.org
        paths:
          - path: /
            pathType: Prefix
    tls: []

  extraSecretEnv:

  extraEnv: {}

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
