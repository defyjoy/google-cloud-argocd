---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: ui
  annotations:
    external-dns.alpha.kubernetes.io/hostname: vault.jrclabs.xyz
    external-dns.alpha.kubernetes.io/class: cloudflare
    # target annotation lives on the parent Gateway, not here.
spec:
  hostnames:
    - vault.jrclabs.xyz
  # gateway-external (gke-l7-regional-external-managed), not the internal `gateway`: this was
  # published through the Cloudflare tunnel until that was removed. external-dns resolves the
  # parent Gateway's address, so re-pointing here is what moves the record to the public LB.
  #
  # http listener only -- the external Gateway has no https listener yet (gke-gateway's
  # https.enabled is false and cert-manager still issues no certificates), so TLS is
  # terminated at the Cloudflare edge, not here.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway-system
      sectionName: http
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}-ui
          port: 8200
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

