enabled: true

victoria-metrics-operator:
  replicaCount: 1

  podSecurityContext:
    enabled: true
    fsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m

  nodeSelector: {}
  tolerations: []
  affinity: {}

  serviceAccount:
    create: true

  rbac:
    create: true

  crds:
    enabled: true
    plain: false

  watchNamespaces: []

  admissionWebhooks:
    enabled: true
    policy: Ignore
    certManager:
      enabled: true
