{{- /*
Shared bearer token for dev -> management cross-cluster remote-write (Phase 6, §23/§29).
Same Vault path/property read on both clusters -- management's VMUser.tokenRef (vmauth.yaml)
validates it, dev's VMAgent.bearerTokenSecret (vmagent.yaml) presents it. Deliberately a
single shared secret, not a keypair, since VMUser bearer-token auth is a plain shared-secret
check, not asymmetric.

Vault population is a manual, human-only step -- same ADR-005 precedent as the Istio
remote-secrets and Kiali remote-cluster kubeconfig (this repo's established convention for
any credential that grants cross-cluster access, not just kubeconfigs). Suggested:
  vault kv put kv/victoria-metrics/remote-write-token token=$(openssl rand -hex 32)
*/ -}}
{{- if .Values.remoteWriteToken.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.vmauth.tokenSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: victoria-metrics
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: remote-write-token
    app.kubernetes.io/managed-by: Helm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.remoteWriteToken.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.vmauth.tokenSecretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/name: victoria-metrics
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: remote-write-token
          app.kubernetes.io/managed-by: Helm
        annotations:
          external-secrets.io/managed-by: external-secrets
  data:
    - secretKey: {{ .Values.vmauth.tokenSecretKey }}
      remoteRef:
        key: {{ .Values.remoteWriteToken.vaultPath }}
        property: token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
