retentionPeriod: "30d"

vmcluster:
  enabled: true
  replicationFactor: 2

  vmstorage:
    replicaCount: 2
    storageClassName: standard-rwo
    storage: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1024Mi

  vminsert:
    replicaCount: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    externalExposure:
      enabled: false

  vmselect:
    replicaCount: 2
    cacheStorage: 2Gi
    storageClassName: standard-rwo
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 512Mi

vmauth:
  enabled: false
  port: "8427"
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi
  tokenSecretName: vminsert-remote-write-token
  tokenSecretKey: token

remoteWriteToken:
  enabled: false
  secretStore: vault-secretstore
  vaultPath: victoria-metrics/remote-write-token

vmagent:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 100m
      memory: 512Mi
  externalLabels: {}
  remoteWrite:
    maxDiskUsagePerURL: 5GB
    url: ""
    auth:
      enabled: false
      secretName: vminsert-remote-write-token
      secretKey: token

vmalert:
  enabled: true
  replicaCount: 1
  evaluationInterval: "30s"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi
  notifier:
    url: "http://kube-prometheus-stack-alertmanager.kube-prometheus-stack.svc:9093"
