{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials-eso
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: zitadel
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.database.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/name: zitadel
          app.kubernetes.io/component: credentials
          app.kubernetes.io/part-of: zitadel
          app.kubernetes.io/managed-by: Helm
        annotations:
          external-secrets.io/managed-by: external-secrets
      # The upstream chart expects a YAML config file under the key
      # referenced by configSecretKey (zitadel-secrets-yaml). ESO's v2
      # template engine substitutes {{ .fieldName }} with the pulled values.
      data:
        zitadel-secrets-yaml: |
          Database:
            Postgres:
              User:
                Password: "{{ `{{ .userPassword }}` }}"
              Admin:
                Password: "{{ `{{ .adminPassword }}` }}"
  data:
    - secretKey: userPassword
      remoteRef:
        key: {{ .Values.externalSecrets.database.vaultPath }}
        property: userPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: adminPassword
      remoteRef:
        key: {{ .Values.externalSecrets.database.vaultPath }}
        property: adminPassword
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
