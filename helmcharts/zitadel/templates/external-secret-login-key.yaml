{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-login-service-key-eso
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: zitadel
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    # Must match login.loginServiceKeySecretName in the upstream chart config
    name: {{ .Values.externalSecrets.loginServiceKey.secretName }}
    creationPolicy: Owner
    # Retain to avoid key rotation on every sync — same rationale as the
    # upstream chart's lookup-based reuse logic (see README.md one-time setup).
    deletionPolicy: Retain
    template:
      # The upstream chart mounts this as a kubernetes.io/tls Secret and passes
      # tls.crt to Zitadel for RS256 JWT verification, tls.key to the Login UI
      # for signing. Must be an RSA keypair; see README.md.
      type: kubernetes.io/tls
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/name: zitadel
          app.kubernetes.io/component: credentials
          app.kubernetes.io/part-of: zitadel
          app.kubernetes.io/managed-by: Helm
        annotations:
          external-secrets.io/managed-by: external-secrets
  data:
    - secretKey: tls.crt
      remoteRef:
        key: {{ .Values.externalSecrets.loginServiceKey.vaultPath }}
        property: tls.crt
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: tls.key
      remoteRef:
        key: {{ .Values.externalSecrets.loginServiceKey.vaultPath }}
        property: tls.key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
