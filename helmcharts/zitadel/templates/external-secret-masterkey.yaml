{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey-eso
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: zitadel
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/managed: "true"
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.masterkey.secretName }}
    creationPolicy: Owner
    # Retain so a Zitadel sync does not delete the immutable masterkey Secret
    # when ArgoCD prunes. Rotate only with an explicit vault kv put + ESO refresh.
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/name: zitadel
          app.kubernetes.io/component: credentials
          app.kubernetes.io/part-of: zitadel
          app.kubernetes.io/managed-by: Helm
        annotations:
          external-secrets.io/managed-by: external-secrets
  data:
    - secretKey: masterkey
      remoteRef:
        key: {{ .Values.externalSecrets.masterkey.vaultPath }}
        property: masterkey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
