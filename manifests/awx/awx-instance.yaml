apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  namespace: awx
  labels:
    app.kubernetes.io/name: awx
    app.kubernetes.io/instance: awx
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"  # Deploy after AWX operator (wave 2) - CRDs must be ready
spec:
  # Basic AWX configuration
  replicas: 1
  service_type: ClusterIP
  
  # Ingress configuration
  ingress_type: ingress
  ingress_class_name: nginx
  hostname: awx.jrclabs.xyz
  # TLS disabled as traffic passes through cloudflared tunnel (Cloudflare handles TLS)
  # ingress_tls_secret: awx-tls
  # Ingress annotations commented out as traffic passes through cloudflared tunnel
  # ingress_annotations:
  #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
  #   nginx.ingress.kubernetes.io/ssl-redirect: "true"
  #   nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  #   nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  #   external-dns.alpha.kubernetes.io/hostname: awx.jrclabs.xyz
  
  # Additional labels to propagate to child resources
  additional_labels:
    - app.kubernetes.io/name
    - app.kubernetes.io/instance
    - app.kubernetes.io/managed-by
  
  # Resource limits (adjust as needed)
  # resources:
  #   requests:
  #     cpu: "500m"
  #     memory: "1Gi"
  #   limits:
  #     cpu: "2000m"
  #     memory: "4Gi"

