apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: aws-secrets-manager
    app.kubernetes.io/part-of: external-secrets
    app.kubernetes.io/component: secretstore
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
      # Optional: Use IAM roles for service accounts (IRSA)
      # role: arn:aws:iam::123456789012:role/external-secrets-operator
      # Optional: Use session token for temporary credentials
      # sessionTokenSecretRef:
      #   name: aws-session-token
      #   key: session-token
  # Optional: Retry configuration
  retrySettings:
    maxRetries: 3
    retryInterval: 30s
  # Optional: Refresh interval for the secret store
  refreshInterval: 5m
