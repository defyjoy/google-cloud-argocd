apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: example-externalsecret
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: example-externalsecret
    app.kubernetes.io/part-of: external-secrets
    app.kubernetes.io/component: externalsecret
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  # Refresh interval for syncing secrets
  refreshInterval: 1h
  # Secret store reference
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  # Target secret configuration
  target:
    name: my-kubernetes-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: my-app
          app.kubernetes.io/instance: my-app
          app.kubernetes.io/part-of: my-app
        annotations:
          app.kubernetes.io/managed-by: external-secrets
      data:
        # Example of using templating
        database-url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}"
  # Secret data mapping
  data:
    - secretKey: username
      remoteRef:
        key: /path/to/database-secret
        property: username
    - secretKey: password
      remoteRef:
        key: /path/to/database-secret
        property: password
    - secretKey: host
      remoteRef:
        key: /path/to/database-secret
        property: host
    - secretKey: port
      remoteRef:
        key: /path/to/database-secret
        property: port
    - secretKey: database
      remoteRef:
        key: /path/to/database-secret
        property: database
  # Optional: Data from multiple sources
  dataFrom:
    - key: /path/to/another-secret
      # Optional: Extract specific properties
      # extract:
      #   key: property-name
      #   property: property-value
  # Optional: Retry configuration
  retrySettings:
    maxRetries: 3
    retryInterval: 30s
  # Optional: Deletion policy
  deletionPolicy: Retain
