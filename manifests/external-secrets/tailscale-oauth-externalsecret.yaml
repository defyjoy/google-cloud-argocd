---
# ExternalSecret for Tailscale OAuth credentials from Vault
# Store OAuth credentials in Vault at secret/tailscale with keys:
# - oauth-client-id: Your Tailscale OAuth client ID (e.g., "k123456CNTRL")
# - oauth-client-secret: Your Tailscale OAuth client secret (e.g., "tskey-client-k123456CNTRL-abcdef")
#
# To store in Vault:
# vault kv put secret/tailscale oauth-client-id="k123456CNTRL" oauth-client-secret="tskey-client-k123456CNTRL-abcdef"
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tailscale-oauth-credentials
  namespace: tailscale
  labels:
    app.kubernetes.io/name: tailscale-operator
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-secretstore
    kind: SecretStore
  target:
    name: tailscale-oauth-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Export as environment variables for Helm values substitution
        OAUTH_CLIENT_ID: "{{ .oauthClientId | toString | b64enc }}"
        OAUTH_CLIENT_SECRET: "{{ .oauthClientSecret | toString | b64enc }}"
  data:
    - secretKey: oauthClientId
      remoteRef:
        key: secret/tailscale
        property: oauth-client-id
    - secretKey: oauthClientSecret
      remoteRef:
        key: secret/tailscale
        property: oauth-client-secret

