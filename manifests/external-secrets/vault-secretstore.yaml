apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secretstore
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: vault-secretstore
    app.kubernetes.io/part-of: external-secrets
    app.kubernetes.io/component: secretstore
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/managed: "true"
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        # Kubernetes authentication
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets-operator"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
        # Alternative: Token authentication
        # tokenSecretRef:
        #   name: vault-token
        #   key: token
        # Alternative: AppRole authentication
        # appRole:
        #   roleId: "role-id"
        #   secretRef:
        #     name: vault-approle-secret
        #     key: secret-id
      # Optional: TLS configuration
      # caProvider:
      #   type: Secret
      #   name: vault-ca
      #   key: ca.crt
      # Optional: Namespace for Vault Enterprise
      # namespace: "admin"
  # Optional: Retry configuration
  retrySettings:
    maxRetries: 3
    retryInterval: 30s
  # Optional: Refresh interval for the secret store
  refreshInterval: 5m
